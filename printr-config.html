<script type="text/javascript">
    RED.nodes.registerType("printr-config", {
        category: "config",
        defaults: {
            name: { value: "" },
            url: { value: "http://raspberrypi:8080", required: true },
        },
        credentials: {
            token: { type: "password" },
        },
        label: function () {
            return this.name || this.url || "Printr";
        },
    });
</script>

<script type="text/html" data-template-name="printr-config">
    <div class="form-row">
        <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-config-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-config-input-url"><i class="fa fa-globe"></i> URL</label>
        <input type="text" id="node-config-input-url" placeholder="http://raspberrypi:8080">
    </div>
    <div class="form-row">
        <label for="node-config-input-token"><i class="fa fa-key"></i> Token</label>
        <input type="password" id="node-config-input-token">
    </div>
</script>

<script type="text/html" data-help-name="printr-config">
    <p>The Printr server and its token. The token is the one set with <code>--token</code> or
    <code>PRINTR_TOKEN</code> on the Printr server.</p>
</script>
